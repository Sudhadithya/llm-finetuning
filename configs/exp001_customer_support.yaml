experiment_name: "mistral_support_v1"
model: "microsoft/phi-2"
dataset_version: "customer_support_v1"
dataset_path: "datasets/customer_support/"

training:
  epochs: 3
  batch_size: 4
  learning_rate: 2e-4
  max_length: 512
  
lora:
  applied: true
  r: 16
  alpha: 32
  dropout: 0.05
  
evaluation:
  metrics: ["bleu", "rouge", "bertscore"]
  generate_samples: true
